openapi: 3.1.0
info:
  title: Billingo API
  version: "1.0.0"
  description: >
    API para que las empresas que usan Billingo se integren directamente, sin pasar por
    el panel web: emitir documentos electrónicos ante la DIAN, o importar documentos que
    la DIAN ya tiene autorizados a partir de su UUID/CUFE técnico.


    Todas las respuestas son en JSON y en español, sin importar el header `Accept` que
    envíe el cliente.


    Cada empresa necesita, además de un token de API válido, tener habilitada la feature
    puntual que quiera usar (ver la pestaña "API" en la edición de la empresa desde el
    panel de superadmin) -- un token válido no es suficiente por sí solo.
servers:
  - url: https://billingo.test/api
    description: Entorno de pruebas local

security:
  - bearerAuth: []

paths:
  /documentos:
    post:
      operationId: emitirDocumento
      summary: Emitir un documento electrónico
      description: |
        Arma, firma y envía a la DIAN una factura electrónica, nota crédito o nota
        débito para la empresa dueña del token usado en la petición, y guarda el
        resultado. Si ya existe un documento con el mismo tipo + numeral + ambiente:
        si quedó aceptado, se devuelve tal cual (no se vuelve a procesar); si quedó
        rechazado o pendiente, se reintenta con los datos nuevos.

        Ejemplo de JSON a enviar (factura electrónica simple, un producto):

        ```json
        {
          "document": {
            "DocumentType": "01",
            "PREFIX": "FES",
            "secuencial": "1",
            "IssueDate": "2026-09-06",
            "DocumentCurrencyCode": "COP",
            "AccountingSupplierParty": {
              "CompanyID": "900123456"
            },
            "AccountingCustomerParty": {
              "PartyName": "Cliente de Ejemplo",
              "direccion": "Calle 123 # 45-67",
              "cityCode": "11001",
              "CountrySubentityCode": "11",
              "CompanyID": "900654321",
              "TypeCompanyID": "31",
              "email": "cliente@ejemplo.com"
            },
            "PaymentMeans": [
              { "PaymentMeansCode": "10" }
            ],
            "Lines": [
              {
                "Quantity": 1,
                "unitCode": "EA",
                "LineExtensionAmount": 100000,
                "TaxTotal": {
                  "TaxSubtotal": {
                    "TaxCategory": {
                      "TaxScheme": { "ID": "01", "Name": "IVA" },
                      "Percent": 19
                    }
                  }
                },
                "Item": {
                  "SellersItemIdentification": { "ID": "producto_1" },
                  "Description": "Producto de prueba"
                },
                "Price": { "PriceAmount": 100000 }
              }
            ],
            "LegalMonetaryTotal": {
              "LineExtensionAmount": 100000,
              "TaxExclusiveAmount": 100000,
              "TaxInclusiveAmount": 119000,
              "AllowanceTotalAmount": 0,
              "ChargeTotalAmount": 0,
              "PayableAmount": 119000
            }
          }
        }
        ```
      tags: [Documentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirDocumentoRequest'
            examples:
              factura:
                summary: Factura electrónica simple, un producto
                value:
                  document:
                    DocumentType: "01"
                    PREFIX: "FES"
                    secuencial: "1"
                    IssueDate: "2026-09-06"
                    DocumentCurrencyCode: "COP"
                    AccountingSupplierParty:
                      CompanyID: "900123456"
                    AccountingCustomerParty:
                      PartyName: "Cliente de Ejemplo"
                      direccion: "Calle 123 # 45-67"
                      cityCode: "11001"
                      CountrySubentityCode: "11"
                      CompanyID: "900654321"
                      TypeCompanyID: "31"
                      email: "cliente@ejemplo.com"
                    PaymentMeans:
                      - PaymentMeansCode: "10"
                    Lines:
                      - Quantity: 1
                        unitCode: "EA"
                        LineExtensionAmount: 100000
                        TaxTotal:
                          TaxSubtotal:
                            TaxCategory:
                              TaxScheme:
                                ID: "01"
                                Name: "IVA"
                              Percent: 19
                        Item:
                          SellersItemIdentification:
                            ID: "producto_1"
                          Description: "Producto de prueba"
                        Price:
                          PriceAmount: 100000
                    LegalMonetaryTotal:
                      LineExtensionAmount: 100000
                      TaxExclusiveAmount: 100000
                      TaxInclusiveAmount: 119000
                      AllowanceTotalAmount: 0
                      ChargeTotalAmount: 0
                      PayableAmount: 119000
      responses:
        '201':
          description: Documento aceptado por la DIAN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoResponse'
        '422':
          description: >
            Datos de la petición inválidos, o la DIAN rechazó el documento (revisar
            "status" y "status_message" en la respuesta).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentoResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Error inesperado emitiendo el documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documentos/import-uuid:
    post:
      operationId: importarPorUuid
      summary: Importar uno o varios documentos por UUID/CUFE
      description: |
        Trae de la DIAN, con el certificado de la empresa, uno o varios documentos ya
        autorizados a partir de su UUID/CUFE técnico, y los guarda en la plataforma. Si
        el UUID ya existía localmente, actualiza ese mismo registro con lo que la DIAN
        tenga en este momento en vez de duplicarlo. No consume cupo del contrato (no
        cuenta como una emisión nueva).

        Máximo 35 UUID por petición: cada uno hace una llamada en vivo a la DIAN, una
        tras otra, dentro del mismo request.

        Ejemplo de JSON a enviar (un solo UUID):

        ```json
        {
          "uuid": "351fc2faecfbc1d4d253b2cf32bd666b7033330f556c5fb93dfc9453a9094c9a34c9dbc9fd3bcedba159e4b197eeadb8"
        }
        ```

        Ejemplo de JSON a enviar (varios UUID en un solo lote):

        ```json
        {
          "uuids": [
            "351fc2faecfbc1d4d253b2cf32bd666b7033330f556c5fb93dfc9453a9094c9a34c9dbc9fd3bcedba159e4b197eeadb8",
            "c188508ca575f91c1d8c830fb2c40d938e406353804b96fa1f4c845d5bfe14f62cc7f7766d2601d62bf9ed067d120738"
          ]
        }
        ```
      tags: [Documentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportarUuidRequest'
            examples:
              uno:
                summary: Un solo UUID
                value:
                  uuid: "351fc2faecfbc1d4d253b2cf32bd666b7033330f556c5fb93dfc9453a9094c9a34c9dbc9fd3bcedba159e4b197eeadb8"
              varios:
                summary: Varios UUID en un solo lote
                value:
                  uuids:
                    - "351fc2faecfbc1d4d253b2cf32bd666b7033330f556c5fb93dfc9453a9094c9a34c9dbc9fd3bcedba159e4b197eeadb8"
                    - "c188508ca575f91c1d8c830fb2c40d938e406353804b96fa1f4c845d5bfe14f62cc7f7766d2601d62bf9ed067d120738"
      responses:
        '200':
          description: >
            Siempre 200 si la petición en sí era válida -- el resultado de cada UUID
            (importado, actualizado, no encontrado, etc.) va dentro de "results", no
            en el código HTTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportarUuidResponse'
        '422':
          description: Datos de la petición inválidos (ej. más de 35 UUID, o ninguno).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token de API de la empresa (ver la pestaña "API" en la edición de la empresa
        desde el panel de superadmin). Se envía una sola vez en texto plano al
        generarlo/regenerarlo -- guárdalo de tu lado, no se puede volver a consultar.

  responses:
    Unauthorized:
      description: Falta el token, o no coincide con ninguna empresa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >
        El token es válido, pero la empresa no tiene el módulo activo o esta API en
        concreto habilitada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    EmitirDocumentoRequest:
      type: object
      required: [document]
      properties:
        document:
          type: object
          required: [DocumentType, PREFIX, secuencial, AccountingSupplierParty, AccountingCustomerParty, PaymentMeans, Lines, LegalMonetaryTotal]
          properties:
            DocumentType:
              type: string
              description: >
                Código DIAN del tipo de documento.


                Valores permitidos:

                - `01`: Factura electrónica de venta

                - `02`: Factura electrónica de venta -- exportación

                - `03`: Factura electrónica de venta -- contingencia tipo 03

                - `04`: Factura electrónica de venta -- contingencia tipo 04

                - `91`: Nota crédito

                - `92`: Nota débito
              enum: ["01", "02", "03", "04", "91", "92"]
              minLength: 2
              maxLength: 2
            CustomizationID:
              type: string
              description: >
                Indicador del tipo de operación.


                Factura (`01`, `02`, `03`, `04`):

                - `09`: AIU

                - `10`: Estándar

                - `11`: Mandatos

                - `12`: Transporte

                - `14`: Notarios

                - `15`: Compra Divisas

                - `16`: Venta Divisas


                Nota crédito (`91`):

                - `20`: Nota Crédito que referencia una factura electrónica

                - `22`: Nota Crédito sin referencia a una factura electrónica


                Nota débito (`92`):

                - `30`: Nota Débito que referencia una factura electrónica

                - `32`: Nota Débito sin referencia a una factura electrónica
              enum: ["09", "10", "11", "12", "14", "15", "16", "20", "22", "30", "32"]
              minLength: 2
              maxLength: 2
            DocumentCurrencyCode:
              type: string
              description: >
                Divisa del documento. Opcional -- si no se manda, el sistema pone "COP". La DIAN
                solo acepta "COP" (rechaza cualquier otro valor).
              enum: ["COP"]
              default: COP
              minLength: 3
              maxLength: 3
            IssueDate:
              type: string
              format: date
              description: >
                Fecha de emisión, formato `AAAA-MM-DD`. Opcional -- si no se manda, el sistema
                pone la fecha actual en zona horaria de Colombia (UTC-05:00).


                Ejemplos válidos: `2026-09-06`
              minLength: 10
              maxLength: 10
            IssueTime:
              type: string
              description: >
                Hora de emisión en formato `HH:MM:SS`, más el offset de zona horaria (siempre
                "-05:00", la hora oficial de Colombia). Opcional -- si no se manda, el sistema
                pone la hora actual en esa misma zona horaria; si se manda sin el offset (ej.
                "14:32:00"), el sistema se lo agrega automáticamente.


                Ejemplos válidos: `14:32:00-05:00`, `14:32:00`
              minLength: 8
              maxLength: 14
            DueDate:
              type: string
              format: date
              description: >
                Fecha de vencimiento, formato `AAAA-MM-DD`. Opcional -- si no se manda, el
                sistema la toma de "PaymentMeans[0].PaymentDueDate" (el primer medio de pago);
                si tampoco viene ahí, el documento queda sin fecha de vencimiento.


                Ejemplos válidos: `2026-09-06`
              minLength: 10
              maxLength: 10
            Note:
              type: array
              description: >
                Notas o texto libre adicional del documento (se muestran en la representación
                gráfica). Opcional, puede traer ninguna, una o varias.
              items:
                type: string
                maxLength: 500
            PREFIX:
              type: string
              description: >
                Prefijo de la resolución de numeración autorizada por la DIAN (ej. "FES").
                Obligatorio -- le indica al sistema cuál resolución activa usar (si la empresa
                tiene varias del mismo tipo de documento) y se combina con "secuencial" para
                armar el número completo del documento.
              maxLength: 4
            secuencial:
              type: string
              description: >
                Consecutivo del documento (sin el prefijo). Obligatorio -- se combina con
                "PREFIX" para armar el número completo del documento (ej. "FES" + "1" = "FES1").
            AccountingSupplierParty:
              type: object
              required: [CompanyID]
              description: >
                Datos del emisor. Solo "CompanyID" es obligatorio, y debe coincidir con el NIT
                configurado en la empresa dueña del token -- el resto de los datos del emisor
                (nombre, dirección, ciudad, teléfono, etc.) que exige la DIAN se toman de lo que
                la empresa ya tiene configurado en Billingo. Los demás campos de este objeto son
                opcionales y solo sirven para reemplazar ese dato puntualmente en este documento
                (no modifican la configuración de la empresa).
              properties:
                PartyName:
                  type: string
                  description: Reemplaza el nombre/razón social del emisor solo en este documento.
                  maxLength: 450
                direccion:
                  type: string
                  description: Reemplaza la dirección (texto libre) del emisor solo en este documento.
                  maxLength: 300
                cityCode:
                  type: string
                  description: >
                    Código DIAN del municipio del emisor para este documento. Va junto con
                    "CountrySubentityCode" (los dos o ninguno).
                  minLength: 5
                  maxLength: 5
                CountrySubentityCode:
                  type: string
                  description: >
                    Código DIAN del departamento del emisor para este documento. Va junto con
                    "cityCode" (los dos o ninguno).
                  minLength: 2
                  maxLength: 2
                CompanyID:
                  type: string
                  description: NIT de la empresa emisora -- debe coincidir con el de la empresa dueña del token.
                  minLength: 3
                  maxLength: 13
                TaxLevelCode:
                  type: string
                  description: >
                    Reemplaza las responsabilidades fiscales del emisor solo en este documento.
                    Puede traer una o varias separadas por ";" (ej. "O-13;O-15"). Si no aplica
                    ninguna de las cuatro, usar el comodín "R-99-PN".


                    Valores permitidos:

                    - `O-13`: Gran contribuyente

                    - `O-15`: Autorretenedor

                    - `O-23`: Agente de retención IVA

                    - `O-47`: Régimen simple de tributación

                    - `R-99-PN`: No aplica -- ninguna de las anteriores
                  enum: ["O-13", "O-15", "O-23", "O-47", "R-99-PN"]
                  maxLength: 30
                telefono:
                  type: string
                  description: Reemplaza el teléfono del emisor solo en este documento.
                email:
                  type: string
                  description: Reemplaza el correo del emisor solo en este documento.
            AccountingCustomerParty:
              type: object
              required: [CompanyID]
              description: >
                Datos del receptor (cliente). Solo "CompanyID" es obligatorio: si ya existe un
                cliente con esa identificación, se usa tal cual y el resto de los campos de este
                objeto son opcionales (sirven para actualizarlo puntualmente en este documento).
                Si el cliente no existe todavía, se crea automáticamente -- pero en ese caso
                "PartyName", "direccion", "cityCode" y "CountrySubentityCode" pasan a ser
                obligatorios (son los datos mínimos que exige la DIAN para el receptor).
              properties:
                AdditionalAccountID:
                  type: string
                  description: >
                    Tipo de persona del receptor.


                    Valores permitidos:

                    - `1`: Persona jurídica

                    - `2`: Persona natural
                  enum: ["1", "2"]
                PartyName:
                  type: string
                  description: Obligatorio junto con los demás campos si el cliente todavía no existe.
                  maxLength: 450
                direccion:
                  type: string
                  description: Dirección del receptor (texto libre).
                  maxLength: 300
                cityCode:
                  type: string
                  description: >
                    Código DIAN del municipio del receptor. Va junto con "CountrySubentityCode"
                    (los dos o ninguno).
                  minLength: 5
                  maxLength: 5
                CountrySubentityCode:
                  type: string
                  description: >
                    Código DIAN del departamento del receptor. Va junto con "cityCode"
                    (los dos o ninguno).
                  minLength: 2
                  maxLength: 2
                CompanyID:
                  type: string
                  description: Identificación del receptor. Si ya existe como cliente, con esto solo basta.
                  minLength: 3
                  maxLength: 30
                TypeCompanyID:
                  type: string
                  description: >
                    Tipo de identificación DIAN del receptor.


                    Valores permitidos:

                    - `11`: Registro civil

                    - `12`: Tarjeta de identidad

                    - `13`: Cédula de ciudadanía

                    - `21`: Tarjeta de extranjería

                    - `22`: Cédula de extranjería

                    - `31`: NIT

                    - `41`: Pasaporte

                    - `42`: Documento de identificación extranjero

                    - `47`: PEP (Permiso Especial de Permanencia)

                    - `48`: PPT (Permiso por Protección Temporal)

                    - `50`: NIT de otro país

                    - `91`: NUIP
                  enum: ["11", "12", "13", "21", "22", "31", "41", "42", "47", "48", "50", "91"]
                TaxLevelCode:
                  type: string
                  description: >
                    Responsabilidades fiscales del cliente. Puede traer una o varias separadas
                    por ";" (ej. "O-13;O-15"). Si no aplica ninguna de las cuatro, usar el
                    comodín "R-99-PN".


                    Valores permitidos:

                    - `O-13`: Gran contribuyente

                    - `O-15`: Autorretenedor

                    - `O-23`: Agente de retención IVA

                    - `O-47`: Régimen simple de tributación

                    - `R-99-PN`: No aplica -- ninguna de las anteriores
                  enum: ["O-13", "O-15", "O-23", "O-47", "R-99-PN"]
                  maxLength: 30
                telefono:
                  type: string
                  description: Teléfono del receptor.
                email:
                  type: string
                  description: Correo del receptor.
            PaymentMeans:
              type: array
              description: >
                Medio(s) de pago del documento. La DIAN sí lo exige, pero en la petición es
                opcional -- si no se manda, el sistema lo completa solo con un pago de contado en
                efectivo (equivalente a mandar `[{"ID": "1", "PaymentMeansCode": "10"}]`) para
                que el documento no se rechace por este campo. Se puede mandar más de uno si el
                documento se paga con varios medios.
              items:
                type: object
                required: [ID, PaymentMeansCode]
                properties:
                  ID:
                    type: string
                    description: >
                      Forma de pago (no confundir con "PaymentMeansCode", que es el medio con el
                      que se paga). La DIAN lo exige siempre -- si no se manda, el sistema lo
                      completa con "1" (contado).

                      - `1`: Contado

                      - `2`: Crédito
                    enum: ["1", "2"]
                    default: "1"
                    minLength: 1
                    maxLength: 1
                  PaymentMeansCode:
                    type: string
                    description: >
                      Medio de pago, catálogo UNTDID 4461. La DIAN lo exige siempre -- si no se
                      manda, el sistema lo completa con "10" (efectivo). El catálogo completo
                      tiene demasiados códigos para listarlos todos acá; estos son los más usados:

                      - `10`: Efectivo

                      - `20`: Cheque

                      - `42`: Consignación bancaria

                      - `47`: Transferencia débito bancaria

                      - `48`: Tarjeta crédito

                      - `49`: Tarjeta débito

                      - `71`: Bonos

                      - `ZZZ`: Acuerdo mutuo (otro medio no listado en el catálogo)
                    default: "10"
                    minLength: 1
                    maxLength: 3
                  PaymentDueDate:
                    type: string
                    format: date
                    description: >
                      Fecha de vencimiento del pago (solo aplica si "ID" es "2", crédito),
                      formato `AAAA-MM-DD`.


                      Ejemplos válidos: `2026-09-06`
                    minLength: 10
                    maxLength: 10
                  PaymentID:
                    type: string
                    description: >
                      Referencia libre del pago (ej. número de transacción, de cheque, de
                      consignación). Opcional.
                    maxLength: 30
            AllowanceCharge:
              type: array
              items:
                $ref: '#/components/schemas/AllowanceCharge'
            LegalMonetaryTotal:
              type: object
              required: [LineExtensionAmount, TaxExclusiveAmount, TaxInclusiveAmount, AllowanceTotalAmount, ChargeTotalAmount, PayableAmount]
              description: >
                Grupo de campos para información relacionadas con los valores totales
                aplicables al documento.
              properties:
                LineExtensionAmount:
                  type: number
                  description: Suma de "LineExtensionAmount" de todas las líneas (subtotal antes de impuestos, después de descuentos de línea).
                TaxExclusiveAmount:
                  type: number
                  description: >
                    Total valor base imponible: la base sobre la que se calculan los impuestos,
                    es decir la suma de las bases gravables de todas las líneas. No se ve
                    afectado por descuentos/cargos a nivel de documento.
                TaxInclusiveAmount:
                  type: number
                  description: Total del documento con impuestos incluidos.
                AllowanceTotalAmount:
                  type: number
                  description: Suma de los descuentos globales del documento ("document.AllowanceCharge" con "ChargeIndicator" en `false`).
                ChargeTotalAmount:
                  type: number
                  description: Suma de los cargos globales del documento ("document.AllowanceCharge" con "ChargeIndicator" en `true`).
                PayableAmount:
                  type: number
                  description: Valor final a pagar (igual a "TaxInclusiveAmount" en los documentos que emite Billingo).
            Lines:
              type: array
              minItems: 1
              description: >
                Grupo de campos para información relacionadas con una línea del documento.
              items:
                $ref: '#/components/schemas/DocumentLine'
            BillingReference:
              type: object
              description: >
                Obligatorio si "document.DocumentType" es "91" (nota crédito) o "92" (nota
                débito) -- identifica la factura electrónica a la que corrige/afecta la nota. No
                aplica (se ignora) si "document.DocumentType" es "01" (factura).
              properties:
                InvoiceDocumentReference:
                  type: object
                  required: [ID, UUID, IssueDate]
                  properties:
                    ID:
                      type: string
                      description: Prefijo + número de la factura referenciada.
                    UUID:
                      type: string
                      description: CUFE de la factura referenciada.
                    IssueDate:
                      type: string
                      format: date
                      description: Fecha de emisión de la factura referenciada.
            DiscrepancyResponse:
              type: object
              description: >
                Obligatorio si "document.DocumentType" es "91" (nota crédito) o "92" (nota
                débito) -- motivo de la nota. No aplica (se ignora) si "document.DocumentType" es
                "01" (factura). No hace falta mandar "Description": el sistema pone
                automáticamente el texto oficial de la DIAN que corresponde al código.
              properties:
                ResponseCode:
                  type: string
                  description: >
                    Código del concepto de la nota -- el catálogo depende de si
                    "document.DocumentType" es "91" o "92".


                    Nota crédito ("91"):

                    - `1`: Devolución parcial de los bienes y/o no aceptación parcial del servicio

                    - `2`: Anulación de factura electrónica

                    - `3`: Rebaja o descuento parcial o total

                    - `4`: Ajuste de precio

                    - `5`: Descuento comercial por pronto pago

                    - `6`: Descuento comercial por volumen de ventas


                    Nota débito ("92"):

                    - `1`: Intereses

                    - `2`: Gastos por cobrar

                    - `3`: Cambio del valor

                    - `4`: Otros
            InvoicePeriod:
              type: object
              description: Solo para notas crédito/débito con período de facturación.
              properties:
                StartDate:
                  type: string
                  format: date
                EndDate:
                  type: string
                  format: date

    AllowanceCharge:
      type: object
      required: [ChargeIndicator, AllowanceChargeReasonCode, AllowanceChargeReason, MultiplierFactorNumeric, Amount, BaseAmount]
      description: >
        Descuentos o cargos a nivel de factura, es decir descuentos o cargos que no afectan las
        bases gravables. Los descuentos o cargos que afectan bases gravables se informan a
        nivel de ítem.
      properties:
        ChargeIndicator:
          type: boolean
          description: >
            Solo puede tener uno de los dos valores, la DIAN rechaza el documento si viene
            cualquier cosa distinta de "true" o "false".

            - `true`: cargo (un débito) -- aumenta el valor de la factura, se reporta en el
            total legal

            - `false`: descuento (un crédito) -- descuenta el valor de la factura antes de
            tributos, también se reporta en el total legal
          enum: [true, false]
        AllowanceChargeReasonCode:
          type: string
          description: >
            Código que categoriza el cargo/descuento.

            - `00`: Descuento no condicionado

            - `01`: Descuento condicionado

            - `02`: Recargo no condicionado

            - `03`: Recargo condicionado (se usa para informar propinas)
          enum: ["00", "01", "02", "03"]
          minLength: 2
          maxLength: 2
        AllowanceChargeReason:
          type: string
          description: Motivo del cargo/descuento.
          minLength: 1
          maxLength: 5000
        MultiplierFactorNumeric:
          type: number
          description: >
            Porcentaje aplicado en decimales, debe corresponder a un valor entre 0 a 100.
          minimum: 0
          maximum: 100
        Amount:
          type: number
          description: >
            Valor total del cargo o descuento. Si es descuento, no puede ser superior al valor
            base.
          minimum: 0
        BaseAmount:
          type: number
          description: >
            Valor base para calcular el descuento o el cargo.
          minimum: 0

    DocumentLine:
      type: object
      required: [Item, Price, Quantity, unitCode, LineExtensionAmount]
      properties:
        Quantity:
          type: number
          description: Cantidad del producto o servicio. La DIAN rechaza el documento si es negativa.
          default: 1
          minimum: 0
        unitCode:
          type: string
          description: >
            Unidad de medida (catálogo de unidades de medida de la DIAN, ej. "EA" unidad,
            "KGM" kilogramo).
          default: EA
        LineExtensionAmount:
          type: number
          description: >
            Valor total de la línea. Cantidad x Precio Unidad menos descuentos más recargos que
            apliquen para la línea.
        AllowanceCharge:
          type: array
          description: >
            Grupo de campos para información relacionadas con un cargo o un descuento a nivel
            de línea.
          items:
            type: object
            required: [ChargeIndicator, MultiplierFactorNumeric, Amount, BaseAmount]
            properties:
              ChargeIndicator:
                type: boolean
                description: >
                  - `true`: cargo (recargo) -- aumenta el valor de la línea

                  - `false`: descuento -- disminuye el valor de la línea
                enum: [true, false]
              AllowanceChargeReason:
                type: string
                description: Motivo del cargo/descuento. Opcional.
                maxLength: 5000
              MultiplierFactorNumeric:
                type: number
                description: Porcentaje aplicado en decimales, debe corresponder a un valor entre 0 a 100.
                minimum: 0
                maximum: 100
              Amount:
                type: number
                description: >
                  Valor total del cargo o descuento. Si es descuento, no puede ser superior al
                  valor base.
                minimum: 0
              BaseAmount:
                type: number
                description: Valor base para calcular el descuento o el cargo.
                minimum: 0
        TaxTotal:
          type: object
          properties:
            TaxSubtotal:
              description: Un objeto único, o una lista si la línea tiene varios impuestos.
              oneOf:
                - $ref: '#/components/schemas/TaxSubtotal'
                - type: array
                  items:
                    $ref: '#/components/schemas/TaxSubtotal'
        Item:
          type: object
          required: [Description]
          properties:
            SellersItemIdentification:
              type: object
              properties:
                ID:
                  type: string
                  description: Código interno del producto -- si no existe en el catálogo, se crea.
                  maxLength: 50
            StandardItemIdentification:
              type: object
              required: [ID]
              properties:
                ID:
                  type: string
                  description: Código de barras.
            Description:
              type: string
              description: Descripción del artículo o servicio al que se refiere la línea.
              maxLength: 300
        Price:
          type: object
          required: [PriceAmount]
          properties:
            PriceAmount:
              type: number

    TaxSubtotal:
      type: object
      properties:
        TaxableAmount:
          type: number
          description: Base gravable explícita (opcional -- si no viene, se calcula).
        TaxCategory:
          type: object
          properties:
            Percent:
              type: number
            TaxScheme:
              type: object
              properties:
                ID:
                  type: string
                  description: Código DIAN del impuesto (ej. "01" IVA).
                  default: "01"
                Name:
                  type: string

    DocumentoResponse:
      type: object
      properties:
        numeral:
          type: string
        tipo_documento:
          type: string
        uuid:
          type: string
          nullable: true
        status:
          type: integer
          description: "0 pendiente, 1 rechazado, 2 aceptado, 3 error."
          enum: [0, 1, 2, 3]
        status_message:
          type: object
          nullable: true
        response:
          type: string
          nullable: true
          description: XML de respuesta de la DIAN, si aplica.

    ImportarUuidRequest:
      type: object
      description: Mandar "uuid" (uno) o "uuids" (varios) -- no ambos.
      properties:
        uuid:
          type: string
        uuids:
          type: array
          minItems: 1
          maxItems: 35
          items:
            type: string

    ImportarUuidResultado:
      type: object
      properties:
        uuid:
          type: string
        status:
          type: string
          enum: [importado, actualizado, no_encontrado, no_pertenece, error]
        message:
          type: string
          nullable: true
        documento:
          type: object
          nullable: true
          properties:
            id:
              type: string
            numeral:
              type: string
            tipo_documento:
              type: string
            uuid:
              type: string
            total:
              type: number

    ImportarUuidResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            importado:
              type: integer
            actualizado:
              type: integer
            no_encontrado:
              type: integer
            no_pertenece:
              type: integer
            error:
              type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImportarUuidResultado'
