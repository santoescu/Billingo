openapi: 3.1.0
info:
  title: Billingo API
  version: "1.0.0"
  description: >
    API para que las empresas que usan Billingo se integren directamente, sin pasar por
    el panel web: emitir documentos electrónicos ante la DIAN, o importar documentos que
    la DIAN ya tiene autorizados a partir de su UUID/CUFE técnico.


    Todas las respuestas son en JSON y en español, sin importar el header `Accept` que
    envíe el cliente.


    Cada empresa necesita, además de un token de API válido, tener habilitada la feature
    puntual que quiera usar (ver la pestaña "API" en la edición de la empresa desde el
    panel de superadmin) -- un token válido no es suficiente por sí solo.
servers:
  - url: https://billingo.test/api
    description: Entorno de pruebas local

security:
  - bearerAuth: []

paths:
  /documentos:
    post:
      operationId: emitirDocumento
      summary: Emitir un documento electrónico
      description: >
        Arma, firma y envía a la DIAN una factura electrónica, nota crédito o nota
        débito para la empresa dueña del token usado en la petición, y guarda el
        resultado. Si ya existe un documento con el mismo tipo + numeral + ambiente:
        si quedó aceptado, se devuelve tal cual (no se vuelve a procesar); si quedó
        rechazado o pendiente, se reintenta con los datos nuevos.
      tags: [Documentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirDocumentoRequest'
            examples:
              factura:
                summary: Factura electrónica simple, un producto
                value:
                  tipo_documento: "01"
                  document:
                    PREFIX: "SETP"
                    secuencial: "990000113"
                    IssueDate: "2026-09-05"
                    DocumentCurrencyCode: "COP"
                    AccountingSupplierParty:
                      CompanyID: "900984424"
                    AccountingCustomerParty:
                      CompanyID: "900984425"
                      TypeCompanyID: "31"
                      PartyName: "David Lima"
                      direccion: "Santa Monica"
                      cityCode: "11001"
                      CountrySubentityCode: "11"
                      email: "david_lima7@hotmail.com"
                    PaymentMeans:
                      - PaymentMeansCode: "10"
                    InvoiceLine:
                      - InvoicedQuantity: 1
                        unitCode: "EA"
                        Item:
                          SellersItemIdentification:
                            ID: "producto_1"
                          Description: "Producto de prueba"
                        Price:
                          PriceAmount: 100000
                        TaxTotal:
                          TaxSubtotal:
                            TaxCategory:
                              TaxScheme:
                                ID: "01"
                                Name: "IVA"
                              Percent: 19
      responses:
        '201':
          description: Documento aceptado por la DIAN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoResponse'
        '422':
          description: >
            Datos de la petición inválidos, o la DIAN rechazó el documento (revisar
            "status" y "status_message" en la respuesta).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentoResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Error inesperado emitiendo el documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documentos/import-uuid:
    post:
      operationId: importarPorUuid
      summary: Importar uno o varios documentos por UUID/CUFE
      description: >
        Trae de la DIAN, con el certificado de la empresa, uno o varios documentos ya
        autorizados a partir de su UUID/CUFE técnico, y los guarda en la plataforma. Si
        el UUID ya existía localmente, actualiza ese mismo registro con lo que la DIAN
        tenga en este momento en vez de duplicarlo. No consume cupo del contrato (no
        cuenta como una emisión nueva).


        Máximo 35 UUID por petición: cada uno hace una llamada en vivo a la DIAN, una
        tras otra, dentro del mismo request.
      tags: [Documentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportarUuidRequest'
            examples:
              uno:
                summary: Un solo UUID
                value:
                  uuid: "c1c86adceababf01e57df7d1caae5cb6101ab12515f19c71c1bd0f3c4309eb58020e9e84c7268d01848b382d79cb4c69"
              varios:
                summary: Varios UUID en un solo lote
                value:
                  uuids:
                    - "c1c86adceababf01e57df7d1caae5cb6101ab12515f19c71c1bd0f3c4309eb58020e9e84c7268d01848b382d79cb4c69"
                    - "879dd0b5521eee7305f46d4b1fd987a4f164c3142c08313a3d11441e6e3a01cb4046ff95165b2b6cdd171233c94ac7c4"
      responses:
        '200':
          description: >
            Siempre 200 si la petición en sí era válida -- el resultado de cada UUID
            (importado, actualizado, no encontrado, etc.) va dentro de "results", no
            en el código HTTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportarUuidResponse'
        '422':
          description: Datos de la petición inválidos (ej. más de 35 UUID, o ninguno).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token de API de la empresa (ver la pestaña "API" en la edición de la empresa
        desde el panel de superadmin). Se envía una sola vez en texto plano al
        generarlo/regenerarlo -- guárdalo de tu lado, no se puede volver a consultar.

  responses:
    Unauthorized:
      description: Falta el token, o no coincide con ninguna empresa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >
        El token es válido, pero la empresa no tiene el módulo activo o esta API en
        concreto habilitada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    EmitirDocumentoRequest:
      type: object
      required: [document]
      properties:
        tipo_documento:
          type: string
          description: Código DIAN del tipo de documento. También se puede mandar como "document.DocumentType".
          enum: ["01", "02", "03", "04", "05", "91", "92", "95"]
        document:
          type: object
          required: [AccountingSupplierParty, AccountingCustomerParty, InvoiceLine]
          properties:
            DocumentType:
              type: string
              description: Alternativa a "tipo_documento" a nivel raíz.
            CustomizationID:
              type: string
            DocumentCurrencyCode:
              type: string
              default: COP
            IssueDate:
              type: string
              format: date
            IssueTime:
              type: string
            DueDate:
              type: string
              format: date
            Note:
              type: array
              items:
                type: string
            PREFIX:
              type: string
              description: Prefijo de la resolución (para desambiguar si hay varias activas).
            Numeral:
              type: string
              description: Número completo (prefijo + consecutivo). Alternativa a "secuencial".
            secuencial:
              type: string
              description: Solo el consecutivo -- se combina con "PREFIX" para armar el numeral completo.
            AccountingSupplierParty:
              type: object
              required: [CompanyID]
              properties:
                CompanyID:
                  type: string
                  description: NIT de la empresa emisora -- debe coincidir con el de la empresa dueña del token.
                PartyName:
                  type: string
                TaxLevelCode:
                  type: string
                direccion:
                  type: string
                cityCode:
                  type: string
                CountrySubentityCode:
                  type: string
                telefono:
                  type: string
                email:
                  type: string
            AccountingCustomerParty:
              type: object
              required: [CompanyID]
              properties:
                CompanyID:
                  type: string
                  description: Identificación del receptor. Si ya existe como cliente, con esto solo basta.
                TypeCompanyID:
                  type: string
                  description: Tipo de identificación DIAN (ej. "13" cédula, "31" NIT).
                PartyName:
                  type: string
                  description: Obligatorio junto con los demás campos si el cliente todavía no existe.
                AdditionalAccountID:
                  type: string
                  description: "\"1\" persona jurídica, cualquier otro valor persona natural."
                TaxLevelCode:
                  type: string
                direccion:
                  type: string
                cityCode:
                  type: string
                CountrySubentityCode:
                  type: string
                telefono:
                  type: string
                email:
                  type: string
            PaymentMeans:
              type: array
              items:
                type: object
                properties:
                  ID:
                    type: string
                    default: "1"
                  PaymentMeansCode:
                    type: string
                    description: Código DIAN del medio de pago (ej. "10" efectivo, "1" a crédito).
                    default: "10"
                  PaymentDueDate:
                    type: string
                    format: date
                  PaymentID:
                    type: string
            AllowanceCharge:
              type: array
              description: Cargos/descuentos globales del documento (opcional).
              items:
                $ref: '#/components/schemas/AllowanceCharge'
            InvoiceLine:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/InvoiceLine'
            BillingReference:
              type: object
              description: Solo para notas crédito/débito -- factura a la que hacen referencia.
              properties:
                InvoiceDocumentReference:
                  type: object
                  properties:
                    ID:
                      type: string
                    UUID:
                      type: string
                    IssueDate:
                      type: string
                      format: date
            DiscrepancyResponse:
              type: object
              description: Solo para notas crédito/débito.
              properties:
                ResponseCode:
                  type: string
                  description: Código del concepto de la nota.
            InvoicePeriod:
              type: object
              description: Solo para notas crédito/débito con período de facturación.
              properties:
                StartDate:
                  type: string
                  format: date
                EndDate:
                  type: string
                  format: date

    AllowanceCharge:
      type: object
      properties:
        ChargeIndicator:
          type: boolean
          description: true = cargo, false/ausente = descuento.
        AllowanceChargeReason:
          type: string
        MultiplierFactorNumeric:
          type: number
          description: Porcentaje (0-1) -- si viene, tiene prioridad sobre "Amount".
        Amount:
          type: number
          description: Valor fijo -- se usa solo si no vino "MultiplierFactorNumeric".

    InvoiceLine:
      type: object
      required: [Item, Price]
      properties:
        InvoicedQuantity:
          type: number
          default: 1
        unitCode:
          type: string
          default: EA
        bodega_id:
          type: string
          description: Id de la bodega de la que se descuenta inventario (opcional).
        Item:
          type: object
          properties:
            SellersItemIdentification:
              type: object
              properties:
                ID:
                  type: string
                  description: Código interno del producto -- si no existe en el catálogo, se crea.
            StandardItemIdentification:
              type: object
              properties:
                ID:
                  type: string
                  description: Código de barras.
            Description:
              type: string
        Price:
          type: object
          required: [PriceAmount]
          properties:
            PriceAmount:
              type: number
        AllowanceCharge:
          $ref: '#/components/schemas/AllowanceCharge'
          description: A lo sumo un descuento/cargo por línea.
        TaxTotal:
          type: object
          properties:
            TaxSubtotal:
              description: Un objeto único, o una lista si la línea tiene varios impuestos.
              oneOf:
                - $ref: '#/components/schemas/TaxSubtotal'
                - type: array
                  items:
                    $ref: '#/components/schemas/TaxSubtotal'

    TaxSubtotal:
      type: object
      properties:
        TaxableAmount:
          type: number
          description: Base gravable explícita (opcional -- si no viene, se calcula).
        TaxCategory:
          type: object
          properties:
            Percent:
              type: number
            TaxScheme:
              type: object
              properties:
                ID:
                  type: string
                  description: Código DIAN del impuesto (ej. "01" IVA).
                  default: "01"
                Name:
                  type: string

    DocumentoResponse:
      type: object
      properties:
        numeral:
          type: string
        tipo_documento:
          type: string
        uuid:
          type: string
          nullable: true
        status:
          type: integer
          description: "0 pendiente, 1 rechazado, 2 aceptado, 3 error."
          enum: [0, 1, 2, 3]
        status_message:
          type: object
          nullable: true
        response:
          type: string
          nullable: true
          description: XML de respuesta de la DIAN, si aplica.

    ImportarUuidRequest:
      type: object
      description: Mandar "uuid" (uno) o "uuids" (varios) -- no ambos.
      properties:
        uuid:
          type: string
        uuids:
          type: array
          minItems: 1
          maxItems: 35
          items:
            type: string

    ImportarUuidResultado:
      type: object
      properties:
        uuid:
          type: string
        status:
          type: string
          enum: [importado, actualizado, no_encontrado, no_pertenece, error]
        message:
          type: string
          nullable: true
        documento:
          type: object
          nullable: true
          properties:
            id:
              type: string
            numeral:
              type: string
            tipo_documento:
              type: string
            uuid:
              type: string
            total:
              type: number

    ImportarUuidResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            importado:
              type: integer
            actualizado:
              type: integer
            no_encontrado:
              type: integer
            no_pertenece:
              type: integer
            error:
              type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImportarUuidResultado'
